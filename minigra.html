<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywna Gra AI – PixelStorm</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 2rem;
            margin: 0;
        }
        nav {
            background: rgba(15, 23, 42, 0.9);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        nav a {
            color: #38bdf8;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .gra-box {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #38bdf8;
            border-radius: 16px;
            max-width: 450px;
            margin: 0 auto;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .przycisk-gry {
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        .przycisk-gry:hover {
            background: #0ea5e9;
            transform: scale(1.05);
        }
        .wynik {
            font-size: 1.5rem;
            margin-top: 1.5rem;
            color: #4ade80;
            font-weight: bold;
        }
        #bot {
            font-size: 4rem;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            transition: transform 0.1s;
            margin: 1rem 0;
        }
        #bot:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Start</a>
        <a href="co-robi-ai.html">Co robi AI?</a>
        <a href="w-czym-pomaga.html">W czym pomaga?</a>
        <a href="minigra.html" style="color: #4ade80;">Mini-Gra</a>
    </nav>

    <main>
        <div class="gra-box">
            <h1 style="color: #38bdf8; margin-top: 0;">🤖 Awaria Reaktorów AI</h1>
            <p>Klikaj w robota najszybciej jak potrafisz przez 10 sekund, aby go naładować!</p>
            
            <div id="bot" onclick="kliknijBota()">🤖</div>
            
            <div>
                <button class="przycisk-gry" id="start-btn" onclick="startGry()">START GRY ⏱️</button>
            </div>
            
            <div id="wynik-tekst" class="wynik">Wynik: 0 kliknięć</div>
            <div id="czas-tekst" style="margin-top: 10px; color: #94a3b8; font-size: 1.1rem;">Czas: 10s</div>
        </div>
    </main>

    <script>
        let klikniecia = 0;
        let graTrwa = false;
        let timer;
        let timeLeft = 10;

        function startGry() {
            if (graTrwa) return;
            
            klikniecia = 0;
            timeLeft = 10;
            graTrwa = true;
            
            document.getElementById('wynik-tekst').innerHTML = "Wynik: 0 kliknięć";
            document.getElementById('czas-tekst').innerHTML = `Czas: ${timeLeft}s`;
            document.getElementById('start-btn').style.opacity = "0.5";
            document.getElementById('start-btn').style.cursor = "not-allowed";

            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('czas-tekst').innerHTML = `Czas: ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    graTrwa = false;
                    document.getElementById('czas-tekst').innerHTML = "Koniec czasu! 🎉";
                    document.getElementById('wynik-tekst').innerHTML = `Twój ostateczny wynik: ${klikniecia} pkt!`;
                    document.getElementById('start-btn').style.opacity = "1";
                    document.getElementById('start-btn').style.cursor = "pointer";
                }
            }, 1000);
        }

        function kliknijBota() {
            if (!graTrwa) return;
            klikniecia++;
            document.getElementById('wynik-tekst').innerHTML = `Wynik: ${klikniecia} kliknięć`;
            
            // Efekt wzdrygnięcia bota
            const botEl = document.getElementById('bot');
            botEl.style.transform = "scale(1.2)";
            setTimeout(() => {
                botEl.style.transform = "scale(1)";
            }, 100);
        }
    </script>
</body>
</html>
