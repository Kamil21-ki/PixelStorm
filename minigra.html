<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Gra AI – PixelStorm</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gra-kontener {
            max-width: 600px;
            margin: 2rem auto;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .wynik {
            font-size: 1.2rem;
            margin-top: 1rem;
            font-weight: bold;
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <nav>
        <a href="index.html" class="logo">Nexus.AI</a>
        <ul class="nav-links">
            <li><a href="index.html">Start</a></li>
            <li><a href="co-robi-ai.html">Co robi AI?</a></li>
            <li><a href="w-czym-pomaga.html">W czym pomaga?</a></li>
            <li><a href="minigra.html" class="active">Mini-Gra</a></li>
        </ul>
    </nav>

    <main>
        <div class="gra-kontener">
            <h2 style="color: var(--accent-blue); margin-bottom: 1rem;">🔐 Zgadnij Szyfr AI</h2>
            <p style="margin-bottom: 1.5rem;">AI wygenerowało tajną liczbę od 1 do 50. Spróbuj ją odgadnąć!</p>
            
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 1rem;">
                <input type="number" id="liczba-input" placeholder="Wpisz liczbę" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: white; width: 150px;">
                <button class="tab-btn" onclick="sprawdzLiczbe()">Sprawdź ⚡</button>
            </div>
            
            <p id="komunikat" class="wynik">Powodzenia w grze!</p>
        </div>
    </main>

    <footer>
        <p>Portal o Sztucznej Inteligencji • PixelStorm 2026</p>
    </footer>

    <script>
        let tajnaLiczba = Math.floor(Math.random() * 50) + 1;

        function sprawdzLiczbe() {
            const wpisana = parseInt(document.getElementById('liczba-input').value);
            const komunikat = document.getElementById('komunikat');

            if (isNaN(wpisana)) {
                komunikat.innerHTML = "⚠️ Najpierw wpisz liczbę!";
                komunikat.style.color = "#f87171";
                return;
            }

            if (wpisana === tajnaLiczba) {
                komunikat.innerHTML = `🎉 Brawo! Trafiłeś idealnie, to była liczba ${tajnaLiczba}!`;
                komunikat.style.color = "var(--accent-sage)";
            } else if (wpisana < tajnaLiczba) {
                komunikat.innerHTML = "📈 Za mało! Szukaj wyżej.";
                komunikat.style.color = "var(--accent-blue)";
            } else {
                komunikat.innerHTML = "📉 Za dużo! Szukaj niżej.";
                komunikat.style.color = "var(--accent-purple)";
            }
        }
    </script>
</body>
</html>
